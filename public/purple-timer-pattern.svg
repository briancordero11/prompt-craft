<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="white"/>
  
  <!-- Timer challenge pattern with octagon center -->
  <polygon points="150,50 200,65 235,100 250,150 235,200 200,235 150,250 100,235 65,200 50,150 65,100 100,65" fill="#7C3AED"/>
  
  <!-- Corner sections -->
  <polygon points="0,0 65,100 50,150 0,150" fill="#8B5CF6"/>
  <polygon points="0,150 50,150 65,200 0,300" fill="#A78BFA"/>
  <polygon points="0,0 150,0 100,65 65,100" fill="#DDD6FE"/>
  <polygon points="150,0 300,0 300,150 250,150 235,100 200,65" fill="#5B21B6"/>
  <polygon points="300,150 250,150 235,200 300,300" fill="#C4B5FD"/>
  <polygon points="0,300 65,200 100,235 150,250 200,235 235,200 300,300" fill="#4C1D95"/>
  
  <!-- White dividing lines -->
  <path d="M0,0 L65,100 L100,65 L150,0" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M150,0 L200,65 L235,100 L300,0" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M0,150 L50,150 L65,100" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M250,150 L300,150" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M0,300 L65,200 L50,150" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M235,200 L250,150" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M300,300 L235,200" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M65,100 L100,65" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M235,100 L200,65" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M65,200 L100,235" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M235,200 L200,235" stroke="white" stroke-width="2.5" fill="none"/>
  <path d="M100,235 L150,250 L200,235" stroke="white" stroke-width="2.5" fill="none"/>
  
  <!-- Timer markers -->
  <circle cx="150" cy="50" r="5" fill="white"/>
  <circle cx="200" cy="65" r="5" fill="white"/>
  <circle cx="235" cy="100" r="5" fill="white"/>
  <circle cx="250" cy="150" r="5" fill="white"/>
  <circle cx="235" cy="200" r="5" fill="white"/>
  <circle cx="200" cy="235" r="5" fill="white"/>
  <circle cx="150" cy="250" r="5" fill="white"/>
  <circle cx="100" cy="235" r="5" fill="white"/>
  <circle cx="65" cy="200" r="5" fill="white"/>
  <circle cx="50" cy="150" r="5" fill="white"/>
  <circle cx="65" cy="100" r="5" fill="white"/>
  <circle cx="100" cy="65" r="5" fill="white"/>
</svg>


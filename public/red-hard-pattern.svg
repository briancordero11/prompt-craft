<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="white"/>
  
  <!-- Complex geometric pattern -->
  <polygon points="0,0 75,25 50,75 25,50" fill="#B91C1C"/>
  <polygon points="75,25 150,0 175,50 125,100 50,75" fill="#F87171"/>
  <polygon points="150,0 300,0 250,75 175,50" fill="#7F1D1D"/>
  <polygon points="25,50 50,75 75,150 0,100" fill="#FECACA"/>
  <polygon points="0,100 75,150 50,225 0,300" fill="#DC2626"/>
  <polygon points="50,75 125,100 150,175 75,150" fill="#EF4444"/>
  <polygon points="175,50 250,75 225,150 150,175 125,100" fill="#991B1B"/>
  <polygon points="250,75 300,0 300,125 225,150" fill="#FCA5A5"/>
  <polygon points="75,150 150,175 125,250 50,225" fill="#EF4444"/>
  <polygon points="0,300 50,225 125,250 100,300" fill="#B91C1C"/>
  <polygon points="150,175 225,150 300,125 300,225 200,250 125,250" fill="#F87171"/>
  <polygon points="100,300 125,250 200,250 300,225 300,300" fill="#7F1D1D"/>
  
  <!-- White dividing lines -->
  <path d="M25,50 L50,75 L75,25 L150,0" stroke="white" stroke-width="2" fill="none"/>
  <path d="M50,75 L125,100 L175,50 L250,75 L300,0" stroke="white" stroke-width="2" fill="none"/>
  <path d="M0,100 L75,150 L150,175 L225,150 L300,125" stroke="white" stroke-width="2" fill="none"/>
  <path d="M0,300 L50,225 L125,250 L200,250 L300,225" stroke="white" stroke-width="2" fill="none"/>
  <path d="M25,50 L0,100" stroke="white" stroke-width="2" fill="none"/>
  <path d="M50,75 L75,25" stroke="white" stroke-width="2" fill="none"/>
  <path d="M175,50 L125,100" stroke="white" stroke-width="2" fill="none"/>
  <path d="M75,150 L50,225" stroke="white" stroke-width="2" fill="none"/>
  <path d="M125,250 L100,300" stroke="white" stroke-width="2" fill="none"/>
  <path d="M150,175 L125,250" stroke="white" stroke-width="2" fill="none"/>
  <path d="M225,150 L200,250" stroke="white" stroke-width="2" fill="none"/>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="white"/>
  
  <!-- Rearranged simple geometric pattern -->
  <polygon points="0,0 100,0 150,150 0,150" fill="#1E3A8A"/>
  <polygon points="100,0 300,0 300,150 150,150" fill="#3B82F6"/>
  <polygon points="0,150 150,150 100,300 0,300" fill="#93C5FD"/>
  <polygon points="150,150 300,150 300,300 100,300" fill="#60A5FA"/>
  
  <!-- White dividing lines -->
  <line x1="0" y1="150" x2="300" y2="150" stroke="white" stroke-width="4"/>
  <line x1="150" y1="150" x2="100" y2="0" stroke="white" stroke-width="4"/>
  <line x1="150" y1="150" x2="100" y2="300" stroke="white" stroke-width="4"/>
</svg>


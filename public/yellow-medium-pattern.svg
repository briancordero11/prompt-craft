<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="white"/>
  
  <!-- Medium complexity geometric pattern -->
  <polygon points="0,0 100,0 150,100 50,150 0,100" fill="#FCD34D"/>
  <polygon points="100,0 300,0 300,100 150,100" fill="#F59E0B"/>
  <polygon points="0,100 50,150 0,300" fill="#FEF3C7"/>
  <polygon points="50,150 150,100 200,200 100,300 0,300" fill="#FBBF24"/>
  <polygon points="150,100 300,100 300,200 200,200" fill="#D97706"/>
  <polygon points="200,200 300,200 300,300 100,300" fill="#FDE68A"/>
  
  <!-- White dividing lines -->
  <path d="M0,100 L50,150 L150,100 L300,100" stroke="white" stroke-width="3" fill="none"/>
  <path d="M50,150 L100,300" stroke="white" stroke-width="3" fill="none"/>
  <path d="M150,100 L200,200 L300,200" stroke="white" stroke-width="3" fill="none"/>
  <path d="M200,200 L100,300" stroke="white" stroke-width="3" fill="none"/>
</svg>

